version: "3.9"

# Общие переменные окружения для всех Celery-компонентов
x-celery-env: &celery-env
  REDIS_URL: redis://redis:6379/0
  CORE_API_URL: http://core:8000
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-INTERNAL_CHANGE_ME}
  SUBFINDER_BIN: /usr/local/bin/subfinder
  NUCLEI_BIN: /usr/local/bin/nuclei
  GITLEAKS_BIN: /usr/local/bin/gitleaks

services:
  # ─── Инфраструктура ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easm}
      POSTGRES_DB: easm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easm -d easm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # В production НЕ открывать 5432 наружу — только internal сеть
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # В production НЕ открывать 6379 наружу
    # ports:
    #   - "6379:6379"

  # ─── Control Plane (FastAPI) ─────────────────────────────────────────────────

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://easm:${POSTGRES_PASSWORD:-easm}@postgres:5432/easm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-INTERNAL_CHANGE_ME}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-changeme}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # 9.E: Neo4j — опционально, graceful degradation если не задан
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Data Plane — Celery Worker ──────────────────────────────────────────────

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A workers.celery_app worker
      --loglevel=info
      --queues=default,discovery,scanning,osint,parsing
      --concurrency=4
      --hostname=worker@%h
    env_file:
      - .env
    environment:
      <<: *celery-env
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d worker@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2

  # ─── Data Plane — Celery Beat (планировщик) ──────────────────────────────────

  beat:
    build:
      context: ./workers
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A workers.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      <<: *celery-env
    depends_on:
      redis:
        condition: service_healthy
    # Beat должен запускаться в единственном экземпляре
    # (дублирование beat приводит к двойной отправке задач)

  # ─── Celery Flower — мониторинг задач ────────────────────────────────────────

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: >
      celery --broker=redis://redis:6379/0 flower
      --port=5555
      --url_prefix=flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpass}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/flower/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── OpenSearch (опционально, для поиска по событиям) ────────────────────────

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "9200:9200"

  # ─── Neo4j (Attack Path Engine, задача 9.E) ─────────────────────────────────

  neo4j:
    image: neo4j:5.20-community
    container_name: easm_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1g"
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - easm_net

networks:
  easm_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  opensearch_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
